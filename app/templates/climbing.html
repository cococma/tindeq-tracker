{% extends "base.html" %}
{% block title %}Climbing · TrainingJournal{% endblock %}
{% block content %}
<h1>Climbing Analytics</h1>

<h2>Volume by grade, per week</h2>
<p class="muted">Sends only; stacked by grade (darker = harder).</p>
<div id="volume" class="chart"></div>

<h2>Max grade sent</h2>
<div id="maxgrade" class="chart"></div>
{% endblock %}

{% block scripts %}
<script>
function isoWeekStart(d) {
    const dt = new Date(d);
    const day = (dt.getDay() + 6) % 7; // Mon = 0
    dt.setDate(dt.getDate() - day);
    return dt.toISOString().slice(0, 10);
}

(async () => {
    const res = await fetch("/api/climbing/volume");
    const climbs = (await res.json()).climbs;
    const volEl = document.getElementById("volume");
    const maxEl = document.getElementById("maxgrade");
    if (!climbs.length) {
        TJ.empty(volEl, "No climbs logged yet — add a climbing entry in the Journal.");
        TJ.empty(maxEl, "No climbs logged yet.");
        return;
    }

    const sends = climbs.filter(c => c.sent);

    // ── Volume by grade per week: stacked bars, single-hue ordinal ramp ──
    const grades = [...new Set(sends.map(c => c.grade))]
        .sort((a, b) => (sends.find(c => c.grade === a).grade_rank ?? 99) -
                        (sends.find(c => c.grade === b).grade_rank ?? 99));
    const weeks = [...new Set(sends.map(c => isoWeekStart(c.entry_date)))].sort();

    // Sequential ramp: one hue (green), light -> dark with grade difficulty
    const ramp = (i, n) => {
        const t = n <= 1 ? 1 : i / (n - 1);
        const L = 78 - t * 40;          // lightness 78% -> 38%
        return `hsl(84, 45%, ${L}%)`;
    };

    const volTraces = grades.map((g, i) => ({
        type: "bar",
        name: g,
        x: weeks,
        y: weeks.map(w => sends.filter(c => c.grade === g && isoWeekStart(c.entry_date) === w).length),
        marker: { color: ramp(i, grades.length), line: { color: TJ.surface, width: 2 } },
        hovertemplate: `${g}: %{y}<extra></extra>`,
    }));
    Plotly.newPlot(volEl, volTraces, TJ.layout({
        barmode: "stack",
        xaxis: TJ.axis({ type: "category", title: "week" }),
        yaxis: TJ.axis({ title: "sends" }),
    }), TJ.config);

    // ── Max grade rank over time ──
    const ranked = sends.filter(c => c.grade_rank != null);
    if (!ranked.length) { TJ.empty(maxEl, "No recognized grades yet."); return; }
    const byDate = new Map();
    for (const c of ranked) {
        const cur = byDate.get(c.entry_date);
        if (!cur || c.grade_rank > cur.grade_rank) byDate.set(c.entry_date, c);
    }
    const pts = [...byDate.values()].sort((a, b) => a.entry_date.localeCompare(b.entry_date));
    Plotly.newPlot(maxEl, [{
        x: pts.map(p => p.entry_date),
        y: pts.map(p => p.grade_rank),
        text: pts.map(p => p.grade),
        mode: "lines+markers+text",
        textposition: "top center",
        textfont: { color: TJ.ink, size: 11 },
        line: { color: TJ.hero, width: 2 },
        marker: { size: 8, color: TJ.hero },
        hovertemplate: "%{text} · %{x}<extra></extra>",
    }], TJ.layout({
        xaxis: TJ.axis({ type: "date", tickformat: "%b %d %Y" }),
        yaxis: TJ.axis({ title: "grade rank", rangemode: "tozero" }),
        showlegend: false,
    }), TJ.config);
})();
</script>
{% endblock %}
